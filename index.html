<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>풍물놀이 소개</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>풍물놀이</h1>
      <p>우리의 가락, 우리의 놀이</p>
    </header>

    <main>
      <section id="intro">
        <h2>풍물놀이란?</h2>
        <p>
          풍물놀이는 꽹과리, 징, 장구, 북 등의 악기를 연주하며 춤과 놀이를
          함께하는 한국의 전통 민속예술입니다.
        </p>
        <img src="images/main.jpg" alt="풍물놀이 공연" />
      </section>

      <section id="instruments">
        <h2>풍물놀이의 악기</h2>
        <p>꽹과리, 징, 장구, 북, 소고 등</p>
        <img src="images/instrument.jpg" alt="풍물 악기" />
      </section>

      <section id="pangut">
        <h2>판굿</h2>
        <p>
          다양한 진법과 춤, 개인놀이가 어우러지는 풍물놀이의 공연 형태입니다.
        </p>
        <img src="images/pangut.jpg" alt="판굿 공연" />
      </section>

      <section id="download">
        <h2>팜플렛 다운로드</h2>
        <a href="files/pamphlet_kr.pdf" download> PDF 팜플렛 다운로드 </a>
      </section>
    </main>

    <footer>
      <p>성공회대학교 민속문화연구회 탈</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
